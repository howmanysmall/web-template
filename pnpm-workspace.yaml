    skills: true
  "@tanstack/react-router":
    skills: true
  "@tanstack/react-start":
    skills: true
  arktype:
    skills: true
  fallow:
    skills: true

strictSsl: true
strictStorePkgContentCheck: true
verifyStoreIntegrity: true
