StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Project

Packages = Google, Microsoft, RedHat, ai-tells, alex, proselint, write-good, Readability, Harper, https://github.com/jdkato/voices/releases/latest/download/Voices.zip

# Harper and Voices ship configs that enable them for every file. Turn them off
# here and back on for the sections that use them.
[*]
Harper = NO
Voices = NO

[*.{md,mdx}]
BasedOnStyles = Vale, Google, ai-tells, alex, proselint
Vale.Spelling = NO

Microsoft.Adverbs = YES
Microsoft.Wordiness = YES
Microsoft.ComplexWords = YES

write-good.Weasel = YES

RedHat.SentenceLength = YES
RedHat.PascalCamelCase = YES
RedHat.MergeConflictMarkers = YES
RedHat.SelfReferentialText = YES

Readability.FleschKincaid = YES

[*.tsx]
BasedOnStyles = Vale, ai-tells, proselint
Vale.Spelling = NO
ai-tells.DoubleHyphen = NO

# The apps: lint the string literals that become page copy, not comments.
# Absence and totality are the product's claims ("Nothing is kept", "Every
# kept clip is deleted", what the server holds), so the rules that question
# them misfit.
[**/apps/*/src/**/*.{ts,tsx}]
BasedOnStyles = Vale, ai-tells, proselint
View = RenderedText
Vale.Spelling = NO
ai-tells.DoubleHyphen = NO
ai-tells.NegatedSubject = NO
ai-tells.UniversalSubject = NO
ai-tells.BareHolds = NO
# The view reads neighboring literals as one run, so a label next to its
# attribute value (`Cancel …`, `data-action="cancel"`) reads as a repeat.
Vale.Repetition = NO

# Strings that never reach a page: tests, stories, generated code, the coach's
# model instructions, and the captures API's response descriptions. The
# practice sentences render, but they are chosen for their sounds, so style
# rules would rewrite the exercise.
[**/apps/*/src/**/*.{test,stories,gen}.{ts,tsx}]
Vale = NO
ai-tells = NO
proselint = NO

[*.mdx]
TokenIgnores = '(?:(?<!\{)(\{#[^\n}]+\})(?!`))|(?:`[^`\n]*(?:\n[^`\n]*)?`)'
Google.Semicolons = NO

[**/apps/*/src/content/**/*.md]
BasedOnStyles = Vale, Voices, Direct, Harper, ai-tells, alex, proselint, write-good
Harper = YES
Voices = YES
Vale.Spelling = NO
write-good.E-Prime = NO
alex.ProfanityUnlikely = NO
Readability.FleschKincaid = NO
RedHat.PascalCamelCase = NO
RedHat.SentenceLength = NO
RedHat.SelfReferentialText = NO
Microsoft.Adverbs = NO
Microsoft.Wordiness = NO
Microsoft.ComplexWords = NO

[README.md]
Google.FirstPerson = NO
Google.We = NO
write-good.Weasel = NO
RedHat.SelfReferentialText = NO

[{AGENTS,CHANGELOG,CODING_STANDARDS,GLOSSARY,THIRD-PARTY-NOTICES}.md]
BasedOnStyles = Vale
Microsoft.Adverbs = NO
Microsoft.Wordiness = NO
Microsoft.ComplexWords = NO
write-good.Weasel = NO
RedHat.SentenceLength = NO
RedHat.PascalCamelCase = NO
RedHat.SelfReferentialText = NO
Readability.FleschKincaid = NO

[{.agents/skills,docs,migrations}/**]
BasedOnStyles = Vale
Vale.Spelling = NO
Microsoft.Adverbs = NO
Microsoft.Wordiness = NO
Readability.FleschKincaid = NO
RedHat.PascalCamelCase = NO
RedHat.SelfReferentialText = NO
RedHat.SentenceLength = NO
write-good.Weasel = NO
Vale.Repetition = NO
proselint.Cliches = NO
