entry = [
	# TanStack Start loads this by convention at runtime. Nothing imports it
	# except a type-only edge from the generated routeTree.gen.ts, so without
	# this declaration it reads as dead the moment route generation changes.
	"apps/*/src/start.ts",
	# The D1 client: ready for routes to import once the app stores data.
	"apps/*/src/db/index.ts",
	# The cf project config; `cf` and the Cloudflare Vite plugin load it by name.
	"apps/*/cloudflare.config.ts",
	# react-doctor config. No fallow plugin detects it.
	"doctor.config.ts",
	# vitest setupFiles target, referenced from a runtime new URL() expression
	# in tools/vite-plus-configuration/src/vitest-shared.ts. Not statically
	# resolvable, and the vitest plugin does not detect setup files.
	"tools/vite-plus-configuration/src/setup.ts",
	"scripts/**/*.ts",
	"turbo/generators/**/*.ts",
	# No-FOUC bootstrap scripts. __root.tsx loads them with <script src> tags
	# in head(); nothing imports them.
	"apps/*/public/*-init.js",
	"apps/*/src/components/ui/*.tsx",
	# Astro sites: Workers, content collections, and file-based routes are
	# loaded by convention, never imported.
	"apps/*/src/worker.ts",
	"apps/*/src/content.config.ts",
	"apps/*/src/pages/**/*.{astro,ts}",
	"apps/*/*.config.ts",
	"apps/*/**/reset.d.ts"
]
ignorePatterns = [
	"references/**",
	"**/.cloudflare/**",
	"apps/*/vendor/**",
	# Generated by `astro sync` and loaded by Storybook.
	"apps/*/.astro/**",
	"apps/*/.storybook/**",
]
ignoreDependencies = [
	"@e18e/eslint-plugin",
	"@isentinel/hooks",
	"@pobammer-ts/small-rules",
	"eslint-plugin-antfu",
	"eslint-plugin-astro",
	"eslint-plugin-better-max-params",
	"eslint-plugin-comment-length",
	"eslint-plugin-de-morgan",
	"eslint-plugin-flawless",
	"eslint-plugin-jsdoc",
	"eslint-plugin-oxfmt",
	"eslint-plugin-perfectionist",
	"eslint-plugin-pnpm",
	"eslint-plugin-storybook",
	"eslint-plugin-unicorn",
	"eslint-plugin-unused-imports",
	# Storybook resolves its addons and framework by name from
	# .storybook/main.ts, which fallow does not analyze.
	"@chromatic-com/storybook",
	"@storybook/addon-a11y",
	"@storybook/addon-docs",
	"@storybook/addon-mcp",
	"@storybook/tanstack-react",
	"@total-typescript/ts-reset",
	"eslint-plugin-sonarjs",
	"oxlint-plugin-react-doctor",
	"@mitata/counters"
]

[duplicates]
# Generated by `cf workers types`; its repeated model schemas are not ours to dedupe.
ignore = [
	"apps/*/.cloudflare/types/index.d.ts",
	"benchmarks/*.bench.ts",
	"apps/*/src/routeTree.gen.ts",
	"scripts/utilities/casing-utilities.ts",
	"**/*.stor{y,ies}.*",
	"**/*.e2e.*",
]

[rules]
unused-files = "error"
unused-exports = "error"
unused-types = "error"
unused-dependencies = "error"
unused-enum-members = "error"
unused-class-members = "error"
unlisted-dependencies = "error"
unresolved-imports = "error"
duplicate-exports = "error"
circular-dependencies = "error"
re-export-cycle = "error"
boundary-violation = "error"
stale-suppressions = "error"
unused-catalog-entries = "error"
empty-catalog-groups = "error"
unresolved-catalog-references = "error"
unused-dependency-overrides = "error"
misconfigured-dependency-overrides = "error"
unused-component-props = "warn"
prop-drilling = "warn"
thin-wrapper = "warn"
duplicate-prop-shape = "warn"
css-token-drift = "warn"
css-duplicate-block = "warn"
css-selector-complexity = "warn"
css-dead-surface = "warn"
css-broken-reference = "warn"

[[boundaries.zones]]
name = "applications"
patterns = ["apps/*/src/**"]

[[boundaries.zones]]
name = "packages"
patterns = ["packages/*/src/**"]

[[boundaries.zones]]
name = "tooling"
patterns = ["tools/*/src/**", "scripts/**", ".opencode/plugins/**", ".opencode/packages/**", "benchmarks/*.bench.ts"]

[[boundaries.rules]]
from = "applications"
allow = ["applications", "packages"]

[[boundaries.rules]]
from = "packages"
allow = ["packages"]

[[boundaries.rules]]
from = "tooling"
allow = ["tooling", "packages"]
